# Blank issues are disabled so that every report arrives with the fields
# needed to act on it. The four forms in this directory cover the cases that
# actually occur; anything outside them belongs in Discussions.
blank_issues_enabled: false

contact_links:
  - name: Question or general discussion
    url: https://github.com/Sudhanshu614/dalal-street-ai/discussions
    about: Setup problems, how something works, whether an idea is worth pursuing. Ask here rather than opening an issue.

  - name: Report a security vulnerability (do not open a public issue)
    url: https://github.com/Sudhanshu614/dalal-street-ai/security/advisories/new
    about: Security problems must NOT be filed as public issues. Use GitHub private vulnerability reporting instead. Read SECURITY.md before reporting.

  - name: Known bugs and planned work
    url: https://github.com/Sudhanshu614/dalal-street-ai/blob/main/docs/ROADMAP.md
    about: An honest list of what is broken and what is missing. Check here before filing anything.
