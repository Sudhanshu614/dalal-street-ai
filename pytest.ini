[pytest]
# Only tests/ is collected. The repository root still holds a number of
# historical test_*.py scratch scripts that hit the network and expect the
# production database; they are not part of the suite.
testpaths = tests

# Put the repository root on sys.path so `import App.config` works without an
# install step. tests/conftest.py does the same, for anyone running pytest
# from an unusual rootdir.
pythonpath = .

# Unknown markers are typos, not features.
addopts = --strict-markers --strict-config

markers =
    integration: needs the production database, the network or an API key. Skipped unless --run-integration is passed.

norecursedirs = .git .venv venv node_modules App/database cache logs extra Project_Blueprint

filterwarnings =
    ignore::DeprecationWarning:pandas.*
